# Publishes a release when a `vX.Y.Z` tag is pushed:
#   1. builds the sdist + wheel (version comes from the tag, via setuptools-scm)
#   2. publishes to PyPI using Trusted Publishing (OIDC - no API token)
#   3. creates a GitHub Release with the artifacts attached
#
# One-time setup before the first tag - see RELEASING.md:
#   - register this repo + workflow as a Trusted Publisher on PyPI
#   - (optional) add a required-reviewer rule to the `pypi` environment

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  pypi:
    needs: build
    runs-on: ubuntu-latest
    if: github.repository == 'BJolly-97/Gen_Config-private'
    environment:
      name: pypi
      url: https://pypi.org/p/clapp-jolly
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
